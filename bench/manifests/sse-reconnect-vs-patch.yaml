manifest_id:    "sse-reconnect-vs-patch"
run_id_prefix:  "sse-reconnect-vs-patch"

duration:       "6h"

warmup:         "30s"
cooldown:       "30s"

max_failures:   2

plan_path:      "app/src/gatling/resources/Plan.json"

prom_url:       "http://192.168.138.2:9090"
prom_step:      "1s"

reset_path:     "/booking/init/:eventId"
event_ids:
  - 1

queries:
  - name:    "http_request_rate"
    promql:  "rate(http_requests_total{job=~\"nest-.*\"}[2s])"
    unit:    "req/s"
  - name:    "http_error_rate"
    promql:  "rate(http_requests_total{job=~\"nest-.*\",status=~\"5..\"}[2s])"
    unit:    "req/s"
  - name:    "event_loop_lag"
    promql:  "nodejs_eventloop_lag_seconds{job=~\"nest-.*\"}"
    unit:    "seconds"
  - name:    "gc_duration"
    promql:  "rate(nodejs_gc_duration_seconds_sum{job=~\"nest-.*\"}[2s])"
    unit:    "seconds/s"
  - name:    "node_cpu"
    promql:  "rate(container_cpu_usage_seconds_total{job=\"cadvisor\",name=~\"realticket_nest.*\"}[4s])"
    unit:    "cores"
  - name:    "node_memory"
    promql:  "container_memory_rss{job=\"cadvisor\",name=~\"realticket_nest.*\"}"
    unit:    "bytes"

slots:
  - name:           "baseline"
    targetUrl:      "http://192.168.138.2:8080"
    image_tag:      "nest:sse-reconnect-vs-patch-baseline"
    scenario_mode:  "PARALLEL"
    source_branch:  "bench/sse-reconnect-vs-patch/baseline"

  - name:           "candidate"
    targetUrl:      "http://192.168.138.2:8081"
    image_tag:      "nest:sse-reconnect-vs-patch-candidate"
    scenario_mode:  "SSE_RECONNECT"
    source_branch:  "bench/sse-reconnect-vs-patch/candidate"

bench_stack:
  alpha_test_account: true
  beta_dual_slots:    true
  gamma_sentinel:     false
  delta_autoscaler:   false

context:
  comparison_variable: >
    좌석 현황 SSE 구조 비교.
    baseline: SSE 1회 연결 유지, section 이동 PATCH 요청 이후 해당 section 좌석 현황 수신.
    candidate: SSE 연결 시 section 지정, section 이동 시 SSE 해제 후 재연결.
  slot_descriptions:
    baseline: "PATCH 기반 section 전환 — SSE 연결 유지하며 서버가 section 변경을 처리"
    candidate: "SSE 재연결 기반 section 전환 — 클라이언트가 SSE 해제+재연결 요청 수행"
  region_flow:
    - step: 입장 권한 확인
    - wait: 50s
    - step: 구독(SSE) + 본예매
  plan_config:
    user_confirmed:
      num_users: 500
      seats_per_user: 0
      request_delay_mean_ms: 4000
      section_move_count: 10
    existing_values_kept:
      request_delay_min_ms: 3000
      request_delay_skew: 1
      section_move_target_strategy: "round_robin"
      no_collision: true
      seed: 0
      snapshot_interval_ms: 500
      network_delay_ms: 50
    sections: "3개 섹션, col_len=50, 각 1000석 (고정 fixture — 변경 불가)"
    derived:
      simulation_duration_ms: 46475
      note: "Plan.json regenerated (num_users=500, seats_per_user=0, section_move_count=10, request_delay_mean=4000, request_delay_min=3000). Committed on Gatling bench/sse-reconnect-vs-patch branch."

implementation_plan:
  status: "completed"
  gatling:
    branch: "bench/sse-reconnect-vs-patch"
    base: "origin/main"
    research_summary: >
      bench/sse-reconnect-vs-patch 브랜치에 SSE_RECONNECT(candidate)와 PARALLEL(baseline) 모드가
      이미 구현되어 있음. PlanConfig num_users=500, seats_per_user=0, section_move_count=10 적용 및
      Plan.json 재생성 완료 (simulation_duration_ms=46475ms). Config.java·push 포함 전체 구현 완료.
    repo_state:
      current_branch: "bench/sse-reconnect-vs-patch"
      dirty: false
      origin_main_latest: "8fb02ed 2026-05-07 fix: ParallelScenario 무한 대기 버그 수정"
      protected_existing_changes:
        - "SseReconnectScenario.java: SSE_RECONNECT 모드 구현 (보존)"
        - "BookingSimulation.java: SSE_RECONNECT dispatch 추가 (보존)"
        - "build.gradle: -P→-D 포워딩 추가 (보존)"
    scenario_decisions:
      - slot: "baseline"
        mode: "PARALLEL"
        custom_required: false
        rationale: "700명 동시 인젝션, Plan.json(no_collision=true) 기반. 동시 SSE 부하 생성에 적합."
      - slot: "candidate"
        mode: "SSE_RECONNECT"
        custom_required: true
        rationale: "section 이동 시 SSE 해제+재연결을 클라이언트에서 수행하는 커스텀 모드. 브랜치에 이미 구현됨."
    change_plan:
      - id: "G1"
        file: "app/src/gatling/resources/PlanConfig.json"
        intent: "num_users=500, seats_per_user=0, section_move_count=10 적용"
        base_code_path: "app/src/gatling/resources/PlanConfig.json"
        preserve: []
        done: true
      - id: "G2"
        file: "app/src/gatling/resources/Plan.json"
        intent: "Run PlanGenerator.py and regenerate Plan.json (simulation_duration_ms=46475ms)"
        base_code_path: "app/src/gatling/resources/PlanGenerator.py"
        preserve: []
        done: true
      - id: "G3"
        file: "app/src/gatling/java/simulations/config/Config.java"
        intent: "TEST_ACCOUNT_ALREADY_STORED=true (alpha_test_account 연동), ENABLE_WAITING_BEFORE_SUBS=true + WAITING_BEFORE_SUBS_MILLIS=50000 (50초 대기 구현)"
        base_code_path: "bench/sse-reconnect-vs-patch 브랜치 Config.java"
        preserve:
          - "SSE_RECONNECT 모드용 기존 설정"
        done: true
      - id: "G4"
        file: "(git remote)"
        intent: "bench/sse-reconnect-vs-patch 브랜치 push (G3 완료 후)"
        base_code_path: ""
        preserve: []
        done: true
    acceptance_checks:
      - "python app/src/gatling/resources/PlanGenerator.py --selftest (4케이스 PASS 확인됨)"
      - "Plan.json stats.simulation_duration_ms > 0 (46475ms confirmed)"
      - "EFFECTIVE_CONFIG 에 scenarioMode/planPath/targetUrl 반영 확인"
      - "BookingSimulation PARALLEL/SSE_RECONNECT dispatch 확인"
      - "TEST_ACCOUNT_ALREADY_STORED=true → stored_test_account_list.json VM 적재 확인"
    risks:
      - "TEST_ACCOUNT_ALREADY_STORED=true 시 stored_test_account_list.json VM에 사전 적재 필수"
      - "SSE_RECONNECT 모드 클라이언트 API 호출 패턴이 baseline과 다름 — 구현 내용 확인 후 실행"
  realticket:
    meta_branch: "bench/sse-reconnect-vs-patch/meta"
    change_plan:
      - id: "R1"
        file: "bench-stack/sse-reconnect-vs-patch.yml"
        intent: "alpha_test_account=true, beta_dual_slots=true 토글 활성화 bench-stack yml 생성"
        done: true
      - id: "R2"
        file: "(git branch)"
        intent: "bench/sse-reconnect-vs-patch/meta 브랜치 생성 → R1 yml commit → push. baseline/candidate 슬롯 브랜치는 이미 존재."
        done: true

workflow_state:
  status: "ready_to_run"
  active_area: "02-orchestration"
  current_task_ref: ""
  last_completed: "PlanConfig reset complete (2026-05-10): request_delay_mean=4000, request_delay_min=3000 + Plan.json regenerated (46475ms). Manifest reflected."
  next_action: "run.sh 실행 — Gatling 브랜치에 PlanConfig·Plan.json push 확인 후 fire-and-forget 시작"
  updated_at: "2026-05-10T15:55:00Z"
  handoff_notes:
    - "Gatling repo: bench/sse-reconnect-vs-patch 체크아웃 상태 — PlanConfig/Plan.json 변경 후 origin push 필요"
    - "RealTicket: meta/baseline/candidate 브랜치 모두 origin push 완료. bench-stack yml (α+β) + prometheus 1s 반영"
    - "stored_test_account_list.json은 Gatling 로컬 resources/에 존재 (untracked, 커밋 불필요) — 로컬 실행 시 classpath에서 자동 로드됨"
    - "PlanConfig 변경 이력: request_delay_mean 7000→5000→4000, request_delay_min 5000→3500→3000. simulation_duration_ms=46475ms"
