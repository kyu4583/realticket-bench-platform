# bench/manifests/m1-self-dry-run.yaml — m1 자체 dry-run 매니페스트
#
# 사용 의도: 본 repo 단독 파이프라인 무결성 검증 — 1 슬롯·iter:2·warmup 30s·per_run 1m·cooldown 15s.
#            queries=`up` (Prom 자체 metric, RealTicket nest 의존성 X).
#            bench_stack 4 토글 모두 disabled → bench-stack/m1-self-dry-run.yml = base.yml 그대로 (7 services).
#            hypotheses 없음 → SUMMARY.md 가설 섹션 미생성.
#            scenario_mode 미override → Config.java default LOGIN_ONLY 적용.
#
# 출처:
#   areas/00-contracts/schema.yaml § 16 core fields + optional bench_stack
#   areas/00-contracts/README.md § Manifest Schema (단일 진실)
#
# Lock #4 (region 단일 진실): regions 는 plan_path 가 가리키는 Plan.json 의 stats.regions 가 원천.
#                              본 매니페스트는 regions 를 정의하지 않는다.
# Lock #3 (alternating only): slots 는 단일 슬롯 — 파이프라인 무결성 검증 의도 정합.

manifest_id:    "m1-self-dry-run"
run_id_prefix:  "m1-self-dry-run"

# iterations XOR duration — 본 매니페스트는 iterations mode
iterations:     2

warmup:         "30s"
per_run:        "1m"
cooldown:       "15s"

max_failures:   1

plan_path:      "app/src/gatling/resources/Plan.json"

prom_url:       "http://192.168.138.2:9090"
prom_step:      "15s"

reset_path:     "/booking/init/:eventId"
event_ids:
  - 1

# queries 1개 = `up` Prometheus 자체 metric (항상 응답, nest 의존성 X)
queries:
  - name:    "prom_up"
    promql:  "up"
    unit:    "binary"

# bench_stack 4 토글 모두 disabled → base.yml 그대로 (7 services)
bench_stack:
  alpha_test_account: false
  beta_dual_slots:    false
  gamma_sentinel:     false
  delta_autoscaler:   false

slots:
  - name:           "baseline"
    targetUrl:      "http://192.168.138.2:8080"
    image_tag:      "nest:m1-self-dry-run"
    # scenario_mode 미정의 → Config.java default LOGIN_ONLY
