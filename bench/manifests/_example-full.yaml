# bench/manifests/_example-full.yaml — 전체 매니페스트 예시 (2 슬롯, hypotheses 포함)
#
# 사용 의도: 15 core fields + optional objects(bench_stack·context·implementation_plan) 시연
#            + slots[].scenario_mode override + slots[].source_branch + hypotheses 가설 절.
# duration mode 사용 — 초기 N = floor((duration_s - warmup_s) / (estimated_iter_s + cooldown_s)).
# estimated_iter_s 는 Plan.json 기반 main_booking_ms + Gatling static waits + runner overhead 로 시작하고
# 실제 iteration wall-clock measured_iter_s rolling average 로 갱신된다.
#
# scenario_mode override:
#   - baseline=SECTION_B (B 안 — PATCH /booking/seat/section)
#   - candidate=SECTION_A (A 안 — SSE close + 새 ?section=N 재연결)
# 두 슬롯은 *번갈아 측정* (Lock #3 alternating only). 동시 부하 X — iter 1=baseline, iter 2=candidate, iter 3=baseline ...
# get_slot_for_iter (run.sh) 가 slot 선택을 결정.
#
# hypotheses:
#   - H1: candidate 의 HTTP 5xx rate 가 baseline 보다 5% 초과 악화되지 않음
#   - H2: candidate 의 재연결 비용으로 event loop lag 가 10% 이상 증가하지 않음
#
# 출처:
#   areas/00-contracts/schema.yaml § 15 core fields + optional objects (yaml 형태 참조)
#   areas/04-gatling-integration/README.md § -P 키 표 + PlanConfig 계약
#   areas/00-contracts/README.md § Manifest Schema (단일 진실)
#
# Lock #3 (alternating only): slots[] = 2, 두 슬롯 *번갈아* 측정 — concurrent dual 미지원.

manifest_id:    "example-full"
run_id_prefix:  "example-full"

# iterations XOR duration — 본 예시는 duration mode (iterations 미정의)
duration:       "10m"

warmup:         "30s"
cooldown:       "15s"

max_failures:   2

plan_path:      "app/src/gatling/resources/Plan.json"

prom_url:       "http://192.168.138.2:9090"
prom_step:      "1s"

reset_path:     "/booking/init/:eventId"
event_ids:
  - 1
  - 2

queries:
  # NestJS /metrics — 애플리케이션 수준 지표
  - name:    "http_request_rate"
    promql:  "rate(http_requests_total{job=~\"nest-.*\"}[2s])"
    unit:    "req/s"
  - name:    "http_error_rate"
    promql:  "rate(http_requests_total{job=~\"nest-.*\",status=~\"5..\"}[2s])"
    unit:    "req/s"
  - name:    "event_loop_lag"
    promql:  "nodejs_eventloop_lag_seconds{job=~\"nest-.*\"}"
    unit:    "seconds"
  - name:    "gc_duration"
    promql:  "rate(nodejs_gc_duration_seconds_sum{job=~\"nest-.*\"}[2s])"
    unit:    "seconds"
  # cAdvisor — 컨테이너 외부 수집 (고부하 영향 없음)
  - name:    "node_cpu"
    promql:  "sum(rate(container_cpu_usage_seconds_total{job=\"cadvisor\",name=~\"realticket_nest.*\"}[4s]))"
    unit:    "cores"
  - name:    "node_memory"
    promql:  "sum(container_memory_rss{job=\"cadvisor\",name=~\"realticket_nest.*\"})"
    unit:    "bytes"

# Lock #3 alternating: slots[] = 2 (≤2). 두 슬롯 *동시* 부하 금지, *번갈아* 측정.
slots:
  - name:           "baseline"
    targetUrl:      "http://192.168.138.2:8080"
    image_tag:      "nest:example-full-baseline"
    scenario_mode:  "SECTION_B"   # B 안 — PATCH /booking/seat/section
    # source_branch 미지정 → origin/dev (기본값)
  - name:           "candidate"
    targetUrl:      "http://192.168.138.2:8081"
    image_tag:      "nest:example-full-candidate"
    scenario_mode:  "SECTION_A"   # A 안 — SSE close + 새 ?section=N 재연결
    source_branch:  "feat/section-reconnect"   # RealTicket 슬롯 브랜치 기점

hypotheses:
  - id:        "H1"
    metric:    "http_error_rate"
    compare:   "candidate <= baseline * 1.05"
    rationale: "A 안(SSE 재연결)의 HTTP 5xx rate 가 B 안보다 5% 초과 악화되지 않는다"
  - id:        "H2"
    metric:    "eventloop_lag_p99_seconds"
    compare:   "candidate <= baseline * 1.10"
    rationale: "A 안의 재연결 비용으로 event loop p99 lag 가 10% 이상 증가하지 않는다"

# ─── 실험 컨텍스트 ─────────────────────────────────────────────────────────
# 파이프라인 미소비. 새 세션 컨텍스트 복원 및 결과 해석용.
context:
  purpose: >
    Compare whether section-scoped SSE reconnects can replace a persistent SSE
    connection plus PATCH section switching without worsening booking stability,
    latency, or container resource pressure.
  comparison_axis: "SSE 아키텍처 비교 — 단일 연결+PATCH(B안) vs section별 재연결(A안)"
  decision_question: >
    Is the candidate reconnect path operationally preferable to the baseline
    PATCH path after accounting for section_move latency, error behavior, and
    node_cpu/node_memory mean/max?
  interpretation_focus:
    - "section_move and main_booking request latency percentiles"
    - "http_error_rate and Gatling KO during repeated section moves"
    - "node_cpu mean/max and node_memory mean/max by slot"
    - "whether any candidate difference is explained by an unequal request mix"
  controls:
    - "baseline and candidate must keep symmetric CPU, memory, deploy, and update settings"
    - "Plan.json, user count, request delays, section count, and seed stay identical across slots"
  baseline:
    branch: "origin/dev"
    notes:  "SSE 1회 연결 유지. section 이동 시 PATCH /booking/seat/section 호출"
  candidate:
    branch: "feat/section-reconnect"
    notes:  "SSE 연결 시 ?section=N 파라미터 지정. section 이동 시 SSE close + reconnect"
  region_flow:  "auth_check → 30s 대기 → subscribe → main_booking"
  plan_config: >
    confirmed: num_users=500, seats_per_user=2, request_delay_mean=2000ms,
    request_delay_min=500ms, request_delay_skew=1, sections=synthetic 3 sections,
    section_move_count=1, section_move_delay_mean_ms=1500,
    section_move_target_strategy=round_robin.
    derived: seed=4586 fixed for baseline/candidate parity,
    snapshot_interval=500, network_delay=50, no_collision=true.
    unresolved: none before PlanGenerator execution.

# ─── 구현 계획 ────────────────────────────────────────────────────────────
# 이 예시는 구현 완료 상태(status: completed). 실제 작성 직후에는 status: "pending".
# 구현 세션이 change_plan/tasks 완료 후 done: true + status: completed 갱신 → run.sh 실행 가능.
implementation_plan:
  status: "completed"    # pending | completed

  gatling:
    branch: "bench/example-full"
    base:   "origin/main"
    research_summary: "기본 PARALLEL 흐름을 기준으로 두 슬롯 모두 section 이동 비교가 필요하다. 기본 4종 mode만으로는 SECTION_A/SECTION_B 의미를 분리할 수 없으므로 커스텀 mode 2개를 매니페스트 브랜치에 한정해 추가한다."
    repo_state:
      current_branch: "main"
      dirty: false
      origin_main_latest: "7126c8a 2026-01-11 chore: 결과 아카이빙 경로 세분화"
      protected_existing_changes: []
    scenario_decisions:
      - slot: "baseline"
        mode: "SECTION_B"
        custom_required: true
        rationale: "PARALLEL 흐름을 복사하고 section 이동 시 PATCH /booking/seat/section 경로만 유지한다."
      - slot: "candidate"
        mode: "SECTION_A"
        custom_required: true
        rationale: "PARALLEL 흐름을 복사하고 section 이동 시 SSE close + section-scoped reconnect 만 변경한다."
    change_plan:
      - id:   G1
        file: "app/src/gatling/java/simulations/config/Config.java"
        intent: "ScenarioMode enum 에 SECTION_A/SECTION_B 추가 및 scenarioMode parse 허용"
        base_code_path: "ScenarioMode.PARALLEL"
        preserve:
          - "기존 -PscenarioMode 주입 경로"
          - "기본 4종 mode 동작"
        done: true
      - id:   G2
        file: "app/src/gatling/java/simulations/booking/BookingSimulation.java"
        intent: "SECTION_A/SECTION_B dispatch 를 추가하되 로그인, Plan 파싱, user injection 흐름은 PARALLEL 과 동일하게 유지"
        base_code_path: "PARALLEL -> ParallelScenario"
        preserve:
          - "login flow"
          - "Plan parsing"
          - "user injection"
        done: true
      - id:   G3
        file: "app/src/gatling/java/simulations/booking/scenario"
        intent: "SECTION_A 는 reconnect 변형, SECTION_B 는 PATCH 변형을 최소 차이로 구현"
        base_code_path: "ParallelScenario"
        preserve:
          - "booking action order"
          - "stored test account handling"
          - "request naming consistency for analysis"
        done: true
      - id:   G4
        file: "app/src/gatling/resources/Plan.json"
        intent: "section 이동이 포함된 deterministic Plan.json 생성"
        base_code_path: "PlanGenerator.py + PlanConfig.json"
        done: true
    acceptance_checks:
      - "python app/src/gatling/resources/PlanGenerator.py --selftest"
      - "EFFECTIVE_CONFIG 에 scenarioMode, targetUrl, planPath 가 의도대로 출력되는지 확인"
      - "Plan.json stats.simulation_duration_ms > 0 확인"
      - "BookingSimulation dispatch 가 SECTION_A/SECTION_B 를 각 시나리오로 연결하는지 확인"
    risks:
      - "화이트리스트 밖 -P 키는 silent no-op 이므로 app/build.gradle benchPropertyKeys 밖 키를 쓰지 않는다."
      - "커스텀 mode 가 PARALLEL 과 다른 공통 흐름을 만들면 비교 noise 가 커진다."
      - "alpha_test_account=true 인 경우 login 액션을 보내지 않아야 한다."

  realticket:
    meta_branch: "bench/example-full"
    slot_branches:
      - slot: "baseline"
        base: "origin/dev"
      - slot: "candidate"
        base: "feat/section-reconnect"
    tasks:
      - id:     R1
        target: "meta_branch"
        what:   "bench-stack/example-full.yml 생성 — base.yml + alpha + beta yq merge"
        done:   true

  git:
    tasks:
      - id:   GIT1
        what: "gatling repo bench/example-full 브랜치 커밋·push"
        done: true
      - id:   GIT2
        what: "RealTicket repo meta+slot 브랜치 커밋·push"
        done: true
      - id:   GIT3
        what: "VM SSH → pull → docker build → stack deploy"
        done: true

# 실행 전 AI 작업 재개 상태. run.sh 실행 이후 진행률은 bench/results/.../progress.json 확인.
workflow_state:
  status: "ready_to_run"
  active_area: "02-orchestration"
  current_task_ref: "run.sh preflight"
  last_completed: "implementation_plan.status completed"
  next_action: "BENCH_PREFLIGHT_ONLY=1 bash areas/02-orchestration/run.sh bench/manifests/_example-full.yaml"
  updated_at: "2026-05-07T00:00:00Z"
  handoff_notes:
    - "예시 파일이므로 실제 매니페스트 작성 시 manifest_id 경로로 바꾼다."
