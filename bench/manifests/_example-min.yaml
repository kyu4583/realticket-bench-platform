# bench/manifests/_example-min.yaml — 최소 매니페스트 예시 (1 슬롯, hypotheses 없음)
#
# 사용 의도: 파이프라인 무결성 검증 — 1 슬롯·iter:1·warmup 30s·cooldown 15s.
# hypotheses 없음 → SUMMARY.md 가설 섹션 미생성.
# scenario_mode 미override → Config.java default LOGIN_ONLY 적용.
#
# 출처:
#   areas/00-contracts/schema.yaml § 15 core fields + optional objects (yaml 형태 참조)
#   areas/01-planning/README.md § Scenario 설계 원칙 (매니페스트 작성 패턴)
#   areas/00-contracts/README.md § Manifest Schema (단일 진실)
#
manifest_id:    "example-min"
run_id_prefix:  "example-min"

# iterations XOR duration — 본 예시는 iterations mode
iterations:     1

warmup:         "30s"
cooldown:       "15s"

max_failures:   1

plan_path:      "app/src/gatling/resources/Plan.json"

prom_url:       "http://192.168.138.2:9090"
prom_step:      "15s"

reset_path:     "/booking/init/:eventId"
event_ids:
  - 1

queries:
  - name:    "http_request_rate"
    promql:  "sum(rate(http_requests_total{job=\"nest-app\"}[1m]))"
    unit:    "req/s"

slots:
  - name:           "baseline"
    targetUrl:      "http://192.168.138.2:8080"
    image_tag:      "nest:example-min"
    # scenario_mode 미정의 → Config.java default LOGIN_ONLY
