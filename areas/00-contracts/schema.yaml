# workflow_state (object, optional) — 실행 전 AI 작업 hand-off 용
# 새 세션은 이 블록을 먼저 읽고 current_task_ref 부터 이어서 진행한다.
# run.sh 는 이 블록을 읽거나 갱신하지 않는다.
# workflow_state:
#   status: "implementing"  # drafting | implementing | blocked | ready_to_run
#   active_area: "04-gatling-integration"
